# OCR eval configuration. Relative paths are resolved from this file's folder.

data_dir: data          # images + same-name .txt ground truth (searched recursively)
output_dir: results     # cached predictions, results.json/.csv, report.html

prompts:                # default prompts; any model can override with system_prompt / user_prompt
  system: prompts/system.md
  user: prompts/user.md

concurrency: 4          # parallel requests per model (override per model with `concurrency`)
timeout: 180            # seconds per request
max_retries: 4          # retries on 429 / 5xx / network errors (exponential backoff)
embed_images: true      # embed images in report.html (self-contained). false = link to data_dir

normalization:
  # Applied to both reference and model output before every metric.
  # Handwriting has no "curly vs straight" quotes or en/em dash distinction, so unify them.
  char_map:
    "‘": "'"
    "’": "'"
    "‚": "'"
    "“": '"'
    "”": '"'
    "„": '"'
    "«": '"'
    "»": '"'
    "‐": "-"
    "‑": "-"
    "–": "—"
    "―": "—"
    "…": "..."
  # Extra mapping used only for the lenient CER (which also ignores case and punctuation).
  lenient_char_map:
    "ё": "е"
    "Ё": "Е"
  strip_markdown: true  # remove code fences, # headings and **bold** from model output

# Model list. Fields:
#   label (unique name in report), provider, model
#   provider: openai | mistral | mistral-ocr | gemini | anthropic
#   optional: temperature, max_tokens, image_detail (openai: low|high|auto), base_url,
#             api_key_env, extra_body (merged into the request JSON), system_prompt, user_prompt,
#             concurrency, enabled, price: {input: USD per 1M tokens, output: USD per 1M tokens}
# Model names change often - check each provider's docs for current ones.
models:
  - label: gpt-5.2
    provider: openai
    model: gpt-5.2
    image_detail: high
    extra_body: {reasoning_effort: low}
    price: {input: 1.75, output: 14.00}

  - label: gpt-5.6-luna
    provider: openai
    model: gpt-5.6-luna
    image_detail: high
    extra_body: {reasoning_effort: low}
    price: {input: 0.20, output: 1.20}

  # - label: gemini-2.5-pro
  #   provider: gemini
  #   model: gemini-2.5-pro
  #   temperature: 0

  - label: gemini-3.8-flash
    provider: gemini
    model: gemini-3.8-flash
    temperature: 0
    extra_body: {generationConfig: {thinkingConfig: {thinkingBudget: 0}}}
    price: {input: 0.75, output: 3.75}

  - label: mistral-medium
    provider: mistral
    model: mistral-medium-latest
    temperature: 0
    price: {input: 1.50, output: 7.50}

  - label: pixtral-12b
    provider: mistral
    model: pixtral-12b
    temperature: 0
    price: {input: 0.15, output: 0.15}

  - label: mistral-ocr          # dedicated OCR endpoint; prompts are ignored
    provider: mistral-ocr
    model: mistral-ocr-latest

  - label: claude-sonnet-5.5
    provider: anthropic
    model: claude-sonnet-5-5
    max_tokens: 8192
    price: {input: 2.00, output: 10.00}

  # Same model, different prompt (prompt A/B test):
  # - label: gpt-5 / strict-prompt
  #   provider: openai
  #   model: gpt-5
  #   system_prompt: prompts/system_strict.md

  # Any OpenAI-compatible endpoint (OpenRouter, vLLM, Ollama, ...):
  # - label: qwen-vl (openrouter)
  #   provider: openai
  #   base_url: https://openrouter.ai/api/v1
  #   api_key_env: OPENROUTER_API_KEY
